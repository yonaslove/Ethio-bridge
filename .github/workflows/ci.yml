name: EthioBridge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        working-directory: ./backend
        run: mvn clean test -Dspring.profiles.active=test

  ai-service-test:
    name: AI Service (Python 3.11 / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./ai-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run pytest
        working-directory: ./ai-service
        env:
          INTERNAL_TOKEN: secret-ai-token-2026
        run: pytest -v

  frontend-test:
    name: Frontend (Angular 18 / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Production Build
        working-directory: ./frontend
        run: npm run build -- --configuration production

  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose Config
        env:
          POSTGRES_DB: ethiobridge
          POSTGRES_USER: ethiobridge
          POSTGRES_PASSWORD: testpassword123
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          KEYCLOAK_REALM: ethiobridge
          KEYCLOAK_FRONTEND_CLIENT_ID: ethiobridge-frontend
          KEYCLOAK_BACKEND_CLIENT_ID: ethiobridge-backend
          CORS_ALLOWED_ORIGINS: http://localhost:4200
          API_PUBLIC_URL: http://localhost:8080/api/v1
          AI_INTERNAL_TOKEN: test-token
          AI_MODEL_NAME: sublinear-tfidf-char3gram-v1
        run: docker compose config
