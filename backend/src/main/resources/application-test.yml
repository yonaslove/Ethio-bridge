spring:
  application:
    name: ethiobridge-backend
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:ethiobridge_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.ethiobridge.internal/realms/ethiobridge

app:
  cors:
    allowed-origins: "http://localhost:4200"
  frontend:
    url: "http://localhost:4200"
  backend:
    public:
      url: "http://localhost:8080"
  security:
    demo-auth:
      enabled: false

ai:
  service:
    base-url: "http://localhost:8000"
    internal-token: "test-ai-internal-token-2026"

chapa:
  secret-key: "CHASECK_TEST-mock-key"
  webhook-secret: "test-webhook-secret-2026"
  callback-url: "http://localhost:8080/api/v1/payments/chapa/webhook"

file:
  signing:
    secret: "test-hmac-file-signing-key-32bytes-long-secret"

eureka:
  client:
    enabled: false

logging:
  level:
    root: INFO
    com.ethiobridge: DEBUG
