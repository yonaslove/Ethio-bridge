server:
  port: 8080

spring:
  application:
    name: ethiobridge-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ethiobridge}
    username: ${SPRING_DATASOURCE_USERNAME:ethiobridge}
    password: ${SPRING_DATASOURCE_PASSWORD:ethiobridge_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2              # keep 2 connections warm always
      maximum-pool-size: 5         # Render free tier DB limit
      idle-timeout: 300000         # 5 min – release idle connections
      connection-timeout: 10000    # fail fast if DB unreachable (10s)
      keepalive-time: 60000        # ping DB every 60s to keep connections alive
      max-lifetime: 1800000        # recycle connections every 30 min
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/ethiobridge}

app:
  security:
    audience: ${APP_SECURITY_AUDIENCE:ethiobridge-backend}
    demo-auth:
      enabled: ${APP_SECURITY_DEMO_AUTH_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    internal-token: ${AI_SERVICE_INTERNAL_TOKEN:dev-secret-internal-token-local}
    timeout-ms: 1500
  cv-ai:
    service-url: ${CV_AI_SERVICE_URL:https://natural-language-processing-resume-ai.onrender.com}
    timeout-ms: 15000
  payment:
    simulation:
      enabled: ${APP_PAYMENT_SIMULATION_ENABLED:true} # Default true during active development/testing; disabled in prod profile

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER:false}
    fetch-registry: ${EUREKA_CLIENT_FETCH:false}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
